version: 2
updates:
  # @secretli/format is a URL dependency on a release archive, which
  # Dependabot cannot follow; move it to a new release by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /
      - /e2e/stack
    schedule:
      interval: weekly
    ignore:
      # Node major versions are bumped deliberately together with .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
