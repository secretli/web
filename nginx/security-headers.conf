# Sent with every response. Included in each location that adds a header of
# its own, because nginx drops the server block's add_header there.
# base-uri, form-action and frame-ancestors don't fall back to default-src,
# and object-src would inherit its 'self'; all four are closed. Styles stay
# 'unsafe-inline' for the <style> sonner adds: with img-src and font-src on
# this origin, a style can't fetch anything from elsewhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# No other page keeps a handle on this one's window, or this one on theirs.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# The QR scanner may use the camera, on this origin only; nothing else may.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
