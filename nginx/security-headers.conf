# Sent with every response. Included in each location that adds a header of
# its own, because nginx drops the server block's add_header there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# The QR scanner may use the camera, on this origin only; nothing else may.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
