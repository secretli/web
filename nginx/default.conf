# The web app as static files. The API is a separate service: in production
# the gateway routes /api/ to it, so it never reaches this server.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # For the orchestrator's probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A misrouted API call gets a JSON 404, never the app's HTML.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Not Found"}';
    }

    # Build output carries a content hash in its name: cache it for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's MIME table has no entry for the web app manifest.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Everything else is the app: a file as it is, any other path the app's
    # index, which routes in the browser. Revalidated on every load, so a
    # deploy reaches everyone at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
